name: besthacks2026

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ./db/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    init: true
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    env_file: ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  fetcher:
    build: ./fetcher
    restart: unless-stopped
    init: true
    env_file: ./fetcher/.env
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
