name: besthacks2026

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: { context: ./backend, target: dev }
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on: [db]

  frontend:
    build: { context: ./frontend, target: dev }
    environment:
      VITE_API_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on: [backend]

  fetcher:
    build: ./fetcher
    env_file: ./fetcher/.env
    volumes:
      - fetchercache:/cache
    depends_on: [db, backend]

volumes:
  pgdata:
  fetchercache:
