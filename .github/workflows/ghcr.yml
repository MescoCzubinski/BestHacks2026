name: ghcr
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: backend
            target: prod
          - image: frontend
            target: prod
          - image: fetcher
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/mescoczubinski/besthacks2026-${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/mescoczubinski/besthacks2026-${{ matrix.image }}:latest
