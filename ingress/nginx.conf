# Generated by ingress/render-nginx.mjs from public-routes.json. Do not edit by hand.
# The only public entry point: / goes to the frontend, an allowlist of /api routes to the backend.

upstream frontend {
  server frontend:3000;
}

upstream backend {
  server backend:8000;
}

server {
  listen 80;

  location ~ ^(/api/places|/api/locations|/api/paths|/api/routes|/api/tags)(/|$) {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/embeddings/warmup {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    return 404;
  }

  location / {
    proxy_pass http://frontend;
    proxy_set_header Host $host;
  }
}
